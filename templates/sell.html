{% extends "layout.html" %}

{% block title %}
    Sell a Share
{% endblock %}

{% block main %}
    <form action="/sell" method="post">
        <div class="mb-3">
            <select class="form-select mx-auto w-auto" name="symbol">
                <option disabled="" selected="">Stock's Symbol</option>
                {% for stock in owned_stocks %}
                  {% if stock.shares|int() > 0 %}
                    <option value="{{ stock.symbol }}">{{ stock.symbol }}</option>
                  {% endif %}
                {% endfor %}
            </select>
        </div>
        <div class="mb-3">
            <input autocomplete="off" autofocus class="form-control mx-auto w-auto" min="1" id="shares" name="shares" placeholder="Shares" type="number">
        </div>
        <button class="btn btn-primary" type="submit">Sell</button>
    </form>
{% endblock %}
